<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48" fill="none">
  <!-- Brand Squircle Icon -->
  <defs>
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFC57" />
      <stop offset="100%" stop-color="#C8F224" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#logoIconGrad)" stroke="#BDE817" stroke-width="0.75" />

  <!-- D Monogram -->
  <path d="M16.5 13H24C29.8 13 34.5 17.8 34.5 24C34.5 30.2 29.8 35 24 35H16.5V13Z" 
