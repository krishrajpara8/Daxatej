        stroke-width="2.7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <path d="M16.5 35C23 33.5 30 29.5 34.5 24" 
        stroke="#FFFFFF" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Logotype DAXATEJ / GLOBAL -->
  <text x="58" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#141715" letter-spacing="-0.02em">DAXATEJ</text>
  <text x="149" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#A8DC08" letter-spacing="-0.01em">/</text>
  <text x="160" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#141715" letter-spacing="-0.02em">GLOBAL</text>

  <!-- Tagline / Descriptor -->
  <text x="59" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#666C64" letter-spacing="0.08em">EXPORT • IMPORT • GLOBAL COMMERCE</text>
</svg>
