<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Brand Squircle Background with Subtle Bevel -->
  <defs>
    <linearGradient id="daxBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFC57" />
      <stop offset="100%" stop-color="#C8F224" />
    </linearGradient>
    <filter id="daxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0E120A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#daxBrandGrad)" stroke="#BDE817" stroke-width="0.75" />

  <!-- Geometric "D" Monogram with Precision Leaf/Lens Intersect -->
  <!-- Outer D stem and contour -->
  <path d="M16.5 13H24C29.8 13 34.5 17.8 34.5 24C34.5 30.2 29.8 35 24 35H16.5V13Z" 
        stroke="#FFFFFF" 
        stroke-width="2.7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
  
  <!-- Inner Dynamic Geometric Arc (Leaf / Lens Contour) -->
  <path d="M16.5 35C23 33.5 30 29.5 34.5 24" 
        stroke="#FFFFFF" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>
